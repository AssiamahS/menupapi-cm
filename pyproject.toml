[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "menupapi-cm"
version = "1.0.3"
description = "MENUPAPI Claude Session Monitor - real 5-hour resets from Claude.ai usage API with fallback estimate mode"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

authors = [
  { name = "Sylvester Assiamah", email = "sylvesterassiamah105@gmail.com" }
]

keywords = [
  "claude",
  "claude-code",
  "monitor",
  "usage",
  "tokens",
  "menubar",
  "terminal",
  "dashboard",
  "session",
  "anthropic"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring"
]

dependencies = [
  "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.1",
  "twine>=5.1.1",
  "ruff>=0.4.8"
]

[project.urls]
Homepage = "https://github.com/AssiamahS/menupapi-cm"
Repository = "https://github.com/AssiamahS/menupapi-cm"
Issues = "https://github.com/AssiamahS/menupapi-cm/issues"

[project.scripts]
cm = "menupapi_cm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["menupapi_cm*"]

[tool.ruff]
line-length = 100
target-version = "py39"
